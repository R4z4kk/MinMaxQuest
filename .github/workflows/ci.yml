name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Daily run so dated data fails loudly once it expires, even without commits.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Dry-run packaging (-d: no upload) so release problems show up before a tag.
      - run: git add -f build/MinMaxQuest.lua
      - uses: BigWigsMods/packager@v2
        with:
          args: -d
      - uses: actions/upload-artifact@v4
        with:
          name: MinMaxQuest-package
          path: .release/*.zip
